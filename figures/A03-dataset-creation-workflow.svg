<text x="126" y="767" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#005A9C" text-anchor="middle">Australia 250 m 2024</text>
<text x="126" y="793" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#005A9C" text-anchor="middle">(fallback)</text>
<text x="126" y="819" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="normal" fill="#005A9C" text-anchor="middle">EOT20 tides</text>
