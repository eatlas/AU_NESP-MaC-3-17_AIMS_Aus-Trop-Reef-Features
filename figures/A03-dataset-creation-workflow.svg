<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="192.711mm" viewBox="0 0 900 1084" role="img" aria-labelledby="title description">
<title id="title">Creation of the Australian Tropical Reef Features dataset</title>
