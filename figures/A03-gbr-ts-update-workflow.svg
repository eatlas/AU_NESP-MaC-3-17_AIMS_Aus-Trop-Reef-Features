<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="192.000mm" viewBox="0 0 900 1080" role="img" aria-labelledby="title description">
<title id="title">Update of the GBR and Torres Strait mapping</title>
<desc id="description">Existing GBR mapping is refreshed while TS mapping is retained, and legacy classes are standardised. Manual interpretation of imagery and bathymetry produces Reef Edits and correction controls. Edits are clipped before integration, identifiers are preserved, and retained legacy features are clipped afterwards. The repeated Coastline50k boxes refer to the same landmask.</desc>
